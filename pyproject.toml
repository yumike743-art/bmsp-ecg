[project]
name = "bmsp-ecg"
version = "1.0.0"
description = "Subject-independent MLII ECG beat classification under controlled noise"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "pandas==2.2.3",
    "pymupdf>=1.26,<1.27",
    "pyyaml==6.0.3",
    "reportlab==4.4.9",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "wfdb==4.3.1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmsp_ecg"]
